services:
  starball:
    build:
      context: .
      dockerfile: Dockerfile
    image: starball:latest
    container_name: starball
    restart: unless-stopped
    environment:
      # Comma-separated list of origins allowed to call the API. Empty
      # default = "require some Origin/Referer" — sufficient when the SPA
      # and the API share an origin (which they do in this single-container
      # setup). Tighten to the exact public hostname when fronted by a
      # reverse proxy (e.g. "https://starball.example.com").
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # Tune if you're getting rate-limited during normal play.
      RATE_LIMIT_WRITE_PER_MIN: "10"
      RATE_LIMIT_READ_PER_MIN: "60"
      # Score sanity ceiling.
      MAX_SCORE: "1000000"
    volumes:
      - starball-data:/var/lib/starball
    # Publish on the host. Comment out when fronted by Traefik (see below).
    ports:
      - "8080:3000"
    # --- Traefik integration -----------------------------------------------
    # To put starball behind an existing Traefik reverse proxy:
    #   1. Comment out the `ports:` block above (Traefik talks to the
    #      container over the shared docker network — no host port needed).
    #   2. Attach this service to the Traefik network:
    #        networks:
    #          - default
    #          - traefik
    #   3. Declare the external network at the bottom of this file:
    #        networks:
    #          traefik:
    #            external: true
    #   4. Uncomment the labels below and adjust the Host rule, entrypoint,
    #      and cert resolver to match your Traefik setup.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik"
    #   - "traefik.http.routers.starball.rule=Host(`starball.example.com`)"
    #   - "traefik.http.routers.starball.entrypoints=websecure"
    #   - "traefik.http.routers.starball.tls=true"
    #   - "traefik.http.routers.starball.tls.certresolver=le"
    #   - "traefik.http.services.starball.loadbalancer.server.port=3000"
    # Once routed through Traefik on a public hostname, also set
    # `ALLOWED_ORIGINS` above to that exact origin.
    # -----------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  starball-data:
