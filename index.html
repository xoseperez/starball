<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starball</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Pure black around the canvas so the playfield edges read clearly. */
        background: #000;
        color: #cbdbfc;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        display: block;
        /* width/height are set in JS so we can match an integer multiple of
           the 640×360 logical surface — no fractional CSS scaling artifacts. */
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
